[project]
name = "personalized-memory-voice-assistant"
version = "0.1.0"
description = "A local web gateway for an existing chat API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "cryptography>=44,<51",
    "httpx>=0.27,<1.0",
    "streamlit>=1.66,<2.0",
    "streamlit-webrtc>=0.63,<1.0",
    "uvicorn>=0.30,<1.0",
    "websockets>=14,<18",
    "python-dotenv>=1.0,<2.0",
    "pydantic-ai-slim[openai]>=1.0,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2.0",
    "opentelemetry-sdk>=1.45,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"
